<!DOCTYPE html>
<html>

<head>
    <title>Jarrecia's Clicker</title>
    <style>
        body {
            background-color: antiquewhite;

        }

        #header {
            border: 1px solid black;
        }

        .blue-txt {
            color: blue;
        }
    </style>
</head>

<body>

    <h1 id="header" class="blue-txt">This is my Clicker</h1>
    <p id="paragraph" class="blue-txt"></p>
    <br>

    <p id="count"></p>
    <button id="button">Click Me!</button>
    <h3 id="welcome-txt"></h3>
    <hr/>

    <h1>Login Practice</h1>

    <label for="email address">Email Address:</label><br>
    <input type="text" id="username" name="username"><br>
    <label for="pwd">Password:</label><br>
    <input type="password" id="pwd" name="pwd">
    <button id="login-btn">Login</button>


    <hr/>
    <h2>Loops</h2>
    <ul id="list"></ul>
    <label for="food-input">Foods</label><br>
    <input type="food-input" id="food-input" name="username"><br>
    <button name="button" id="add-food">Add food</button>
    



    
    <script src="clicker.js"></script>
    <!-- <script src="login.js"></script> -->
    <script src="loops.js"></script>






</body>

</html>
